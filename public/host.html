<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apresentador · Enquete ao vivo</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { display: block; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }
    .topbar h2 { margin: 0; font-size: 16px; }
    .count-badge {
      background: var(--orange-soft);
      color: var(--orange);
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 18px 24px 28px;
      border-top: 1px solid var(--border);
    }
    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 26px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: var(--orange); color: #1a1205; }
    .btn-secondary { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .qr-box { background: #fff; padding: 14px; border-radius: 16px; display: inline-block; }
    .qr-box img { display: block; width: 220px; height: 220px; }
    .join-link {
      margin-top: 14px;
      font-size: 14px;
      color: var(--text-dim);
      word-break: break-all;
    }
    .bar-row .label span:first-child { color: var(--text); }
  </style>
</head>
<body>
  <div class="topbar">
    <h2>🎤 Painel do apresentador</h2>
    <span class="count-badge" id="count-badge">0 conectados</span>
  </div>
  <div id="app" class="screen" style="min-height: 50vh;"></div>
  <div class="controls" id="controls"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/host.js"></script>
</body>
</html>
